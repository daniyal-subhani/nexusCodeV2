name: nexusCoreV2
services:
  auth-db:
    image: mysql:9.0
    container_name: nexusCoreV2-auth-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${AUTH_DB_NAME}
      MYSQL_USER: ${AUTH_DB_USER}
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD}
    ports:
      - '${AUTH_DB_PORT}:3306'
    volumes:
      - auth-db-data:/var/lib/mysql
    networks:
      - nexusCoreV2-network
    healthcheck:
      test:
        ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${AUTH_DB_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  user-db:
    image: postgres:18
    container_name: nexusCoreV2-user-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - '${USER_DB_PORT}:5432'
    volumes:
      - user-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${USER_DB_USER} -d ${USER_DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - nexusCoreV2-network

  chat-db:
    image: mongo:8.0
    container_name: nexusCoreV2-chat-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_DATABASE: ${CHAT_DB_NAME}
      MONGO_INITDB_ROOT_USERNAME: ${CHAT_DB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${CHAT_DB_ROOT_PASSWORD}
    ports:
      - '${MONGO_PORT}:27017'
    volumes:
      - chat-db-data:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --username $${MONGO_INITDB_ROOT_USERNAME} --password $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval ''db.runCommand("ping").ok'' --quiet',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - nexusCoreV2-network

volumes:
  auth-db-data:
  user-db-data:
  chat-db-data:

networks:
  nexusCoreV2-network:
    driver: bridge
